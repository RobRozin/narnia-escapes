<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Narnia Escapes</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Vollkorn+SC:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      [v-cloak] {
        display: none;
      }
    </style>
    <!--  Petite Vue -->
    <script type="text/javascript" src="./js/petite-vue.iife.js" defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./js/tailwind-config.js"></script>
    <script>
      window.NARNIA_CONFIG = window.NARNIA_CONFIG || {};
    </script>
  </head>
  <body
    id="app"
    class="bg-paper text-body font-body overscroll-y-none"
    v-cloak
    v-scope
    @vue:mounted="mounted"
    @vue:unmounted="unmounted"
  >
    <div v-scope="Navbar()"></div>
    <div v-scope="HeroSection()"></div>
    <div v-scope="HighlightsSection()"></div>

    <div v-scope="RetreatsSection()"></div>
    <div v-scope="SaunaSection()"></div>
    <div v-scope="EventsSection()"></div>
    <div v-scope="AboutSection()"></div>
    <div v-scope="ContactSection()"></div>
    <div v-scope="FooterSection()"></div>
    <div v-scope="NewsletterModal()"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
