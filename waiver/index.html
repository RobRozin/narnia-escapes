<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Waiver - Narnia Escapes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/site.css" />
  </head>

  <body class="bg-neutral-50 font-body text-body">
    <main>
      <section id="waiver" class="py-20">
        <div class="mx-auto max-w-4xl px-6">
          <h1 class="mb-8 text-center font-heading text-3xl">Waiver Form</h1>
          <p class="mb-12 text-center text-lg text-gray-700">
            Please read the waiver carefully and complete the form below.
          </p>
          <div class="overflow-hidden rounded-xl shadow-lg">
            <iframe
              id="waiverForm"
              src="https://docs.google.com/forms/d/e/1FAIpQLSdYsuxDFr9b_6ofOGS8DWttZq84m_6zCsWB5jgdAZODhRxuDw/viewform?embedded=true"
              title="Narnia Escapes waiver form"
              class="w-full"
              style="border: 0"
              scrolling="no"
            >Loading…</iframe>
          </div>
        </div>
      </section>
    </main>

    <script>
      (function () {
        const el = document.getElementById("waiverForm");

        function pickHeight() {
          const vw = window.innerWidth;
          const vh = window.innerHeight;

          if (vw < 380) return Math.max(500, Math.floor(vh * 4.2));
          if (vw < 640) return Math.max(4000, Math.floor(vh * 3.4));
          if (vw < 1024) return 3300;
          if (vw < 1280) return 2400;
          return 2700;
        }

        function setHeight() {
          el.style.height = pickHeight() + "px";
        }

        setHeight();
        let resizeTimer;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(setHeight, 120);
        });
      })();
    </script>
  </body>
</html>
